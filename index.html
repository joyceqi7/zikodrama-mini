<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <!-- API 域名来自环境；首页请求由路由判断后启动，直达播放不抢下载首页列表。 -->
    <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230b0b0d%22/><path d=%22M12 9v14l12-7z%22 fill=%22%23ff3158%22/></svg>" />
    <title>Drama Minis</title>
    <style>
      .campaign-entry-cover { position: fixed; inset: 0; overflow: hidden; background: #080809; }
      .campaign-entry-cover > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .campaign-cover-caption { position: absolute; inset: auto 0 0; padding: 64px 20px max(24px, env(safe-area-inset-bottom)); color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.84)); font: 600 18px/1.35 system-ui, sans-serif; overflow-wrap: anywhere; }
      .campaign-cover-caption > div + div { margin-top: 4px; font-size: 14px; font-weight: 400; }
    </style>
    <!-- 官方容器要求 SDK 为 head 中首个脚本，且禁止 async/defer；就绪后再初始化身份与播放器。 -->
    <script data-tiktok-sdk="true" src="https://connect.tiktok-minis.com/drama/sdk.js" onload="this.dataset.loaded='true'" onerror="this.dataset.failed='true'"></script>
    <script>
      window.__TIKTOK_MINIS_INITIALIZE__ = async function initializeTikTokMinis() {
        var clientKey = "%VITE_TIKTOK_CLIENT_KEY%";
        window.__TIKTOK_MINIS_CLIENT_KEY__ = clientKey;
        if (window.__TIKTOK_MINIS_INITIALIZED__) return;
        if (window.TTMinis && clientKey && clientKey.indexOf("replace_with_") !== 0 && clientKey.indexOf("%") === -1) {
          await window.TTMinis.init({ clientKey: "%VITE_TIKTOK_CLIENT_KEY%" });
          window.__TIKTOK_MINIS_INITIALIZED__ = true;
        } else {
          throw new Error("TikTok SDK Client Key is unavailable");
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
