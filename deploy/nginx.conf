server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # TikTok Minis SDK 由官方域名加载；index.html 中的启动脚本需要 unsafe-inline。
    # connect-src 允许 HTTPS/WSS，用于 TikTok SDK 与官方 BytePlus Player 的动态服务端点。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https: wss:; font-src 'self' data: https:; form-action 'self'; frame-src https:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; object-src 'none'; script-src 'self' 'unsafe-inline' blob: 'wasm-unsafe-eval' https://connect.tiktok-minis.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
